name: Actualizar precios

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 ART diario
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias PDF/OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
          pip install pypdf pillow pdf2image pytesseract
      - name: Correr bot de precios
        run: python scripts/update_precios.py || echo "Bot marcó stale, se conserva JSON anterior"
      - name: Commit si hubo cambios
        run: |
          git config user.name "superbarato-bot"
          git config user.email "bot@superbarato.local"
          git add data/catalogo/
          git diff --cached --quiet || git commit -m "update: catalogo Cordoba Capital $(date +%F)"
          git push
